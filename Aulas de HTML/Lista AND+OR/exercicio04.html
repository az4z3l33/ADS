<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <h1>Acesso VIP</h1>
    <label for="ipt_idade">Idade: </label>
    <input type="number" id="ipt_idade" placeholder="Insira sua Idade">
    <br>
    <label for="slc_ingresso">Tem ingresso VIP? </label>
    <select id="slc_ingresso">
        <option value="#" disabled selected>Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <label for="slc_convite">Tem convite especial? </label>
    <select id="slc_convite">
        <option value="#" disabled selected>Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <button onclick="liberar()">Liberar acesso</button>
</body>
</html>
<script>
    function liberar() {
        let idade = Number(ipt_idade.value);
        let ingresso = slc_ingresso.value;
        let convite = slc_convite.value;

        if(idade >= 18 && (ingresso == 1 || convite == 1)) {
            alert('Acesso liberado à área VIP')
        } else {
            alert('Acesso negado')
        }
    }
</script>
