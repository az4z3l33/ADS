<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    <h1>Check-in de Voo</h1>
    <label for="slc_doc">Documento está válido? </label>
    <select id="slc_doc">
        <option value="#">Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <label for="slc_check">Fez check-in online? </label>
    <select id="slc_check">
        <option value="#">Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <label for="ipt_horas">Quantas horas de antecedencia ao voo? </label>
    <input type="number" id="ipt_horas">
    <br>
    <button onclick="verificar()">Verificar embarque</button>
</body>
</html>
<script>
    function verificar() {
        let doc = slc_doc.value;
        let check = slc_check.value;
        let horas = Number(ipt_horas.value);

        if(doc == 1 && (check == 1 || horas >= 2)) {
            alert('Embarque liberado')
        } else {
            alert('Embarque negado')
        }
    }
</script>
