<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<body>
    <h1>Financiamento</h1>
    <label for="ipt_idade">Informe sua idade: </label>
    <input type="number" id="ipt_idade">
    <br>
    <label for="slc_cnh">Possui CNH válida? </label>
    <select id="slc_cnh">
        <option value="#" selected disabled>Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <label for="ipt_renda">Sua renda mensal: </label>
    <input type="number" id="ipt_renda">
    <br>
    <label for="slc_fiador">Solicitou um fiador? </label>
    <select id="slc_fiador">
        <option value="#" selected disabled>Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <button onclick="analisar()">Analisar financiamento</button>
</body>
</html>
<script>
    function analisar() {
        let idade = Number(ipt_idade.value);
        let cnh = slc_cnh.value;
        let renda = Number(ipt_renda.value);
        let fiador = slc_fiador.value;

        if(idade >= 21 && cnh == 1 && (renda >= 2500 || fiador == 1)) {
            alert('Financiamento aprovado')
        } else {
            alert('Financiamento negado!')
        }
    }
</script>
