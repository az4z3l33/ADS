<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>
    <h1>Bolsa de Estudos</h1>
    <label for="ipt_renda">Renda familiar per capita: </label>
    <input type="number" id="ipt_renda" placeholder="Insira sua renda">
    <br>
    <label for="ipt_media">Média escolar: </label>
    <input type="number" id="ipt_media">
    <br>
    <label for="slc_atleta">É atleta federado? </label>
    <select id="slc_atleta">
        <option value="#" disabled selected>Selecione uma opção</option>
        <option value="1">Sim</option>
        <option value="2">Não</option>
    </select>
    <br>
    <button onclick="verificar()">Verificar bolsa</button>
</body>
</html>
<script>
    function verificar() {
        let renda = Number(ipt_renda.value);
        let media = Number(ipt_media.value);
        let federado = slc_atleta.value;

        if((renda <= 800 && media >= 8) || (federado == '1' && media >= 6)){
            alert('Bolsa integral concedida!')
        } else {
            alert('Bolsa não concedida')
        }
    }
</script>
