<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Processo Seletivo</h1>
    <label for="ipt_vest">Vestibular: </label>
    <input type="number" id="ipt_vest" placeholder="Insira sua nota do Vestibular">
    <br>
    <label for="ipt_enem">ENEM: </label>
    <input type="number" id="ipt_enem" placeholder="Insira sua nota do ENEM">
    <br>
    <label for="ipt_reda">Redação: </label>
    <input type="number" id="ipt_reda" placeholder="Insira sua nota da redação do ENEM">
    <br>
    <button onclick="verificar()">Verificar aprovação</button>
</body>
</html>
<script>
    function verificar() {
        let vest = Number(ipt_vest.value);
        let enem = Number(ipt_enem.value);
        let reda = Number(ipt_reda.value);

        if(vest >= 700 || (enem >= 650 && reda > 0)) {
            alert('Aprovado!')
        } else {
            alert('Não aprovado!')
        }
    }
</script>
