<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="ipt_nota">Sua nota: </label>
    <input type="number" id="ipt_nota">
    <button onclick="verificar()">Avaliar aluno</button>
</body>
</html>
<script>
    function verificar() {
        let n1 = Number(ipt_nota.value)

        if(n1 < 6) {
            alert('Aluno não aprovado')
        } else if(n1 >= 6 && n1 < 8.5) {
            alert('Aluno comum e aprovado')
        }
        else if(n1 >= 8.5 && n1 <= 10) {
            alert('Aluno Exemplar!')
        }
        
    }
</script>
