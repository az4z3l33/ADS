<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        div#div_result {
            border: 1px solid black;
            width: fit-content;
            padding: 3px;
        }


    </style>
</head>
<body>
    <h1>Atualizar salário</h1>
    <div id="div_result">
        
    </div>
    <br>
    <button onclick="receber()">Receber 100</button>
    <button onclick="pagar()">Pagar 50</button>
    
</body>
</html>
<script>
    let salario = 0;

    function receber() {
        salario += 100;

        div_result.innerHTML = `Transferência de R$100 recebida! Saldo atual: R$${salario}`
    }

    function pagar() {
        salario -= 50;

        div_result.innerHTML = `Pagamento de R$50 efetuado! Saldo atual: R$${salario}`
    }
</script>
