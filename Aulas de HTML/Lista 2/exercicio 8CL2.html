<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>
<body>
    <h1>Vale Transporte</h1>
    <span>Valor da passagem: </span>
    <input type="number" id="input_valor">
    <br>
    <span>Quantidade de viagens por mês: </span>
    <input type="number" id="input_mes">
    <br>
    <span>Distância Trabalho -- > Casa: </span>
    <input type="number" id="input_distancia">
    <br>
    <button onclick="vale()">Calcular VT</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function vale() {
        let n1 = Number(input_valor.value)
        let n2 = Number(input_mes.value)
        let n3 = Number(input_distancia.value)
        let mes = n1 * n2
        let uberValor = mes * Number(0.75)
        let total = mes + uberValor

        div_result.innerHTML = `Você vai gastar R$${total} por mês com transporte`
    }
</script>
