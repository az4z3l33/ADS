<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <span>Valor da passagem: </span>
    <input type="number" id="input_valor">
    <br>
    <span>Quantidade de viagens: </span>
    <input type="number" id="input_qtd">
    <button onclick="economia()">Ver economia</button>
    <div id="div_result">

    </div>
</body>
</html>
<script>
    function economia() {
        let n1 = Number(input_valor.value)
        let n2 = Number(input_qtd.value)
        let result = n1 * n2

        div_result.innerHTML = `Você economizará R$${result / Number(2)}`
    }
</script>
