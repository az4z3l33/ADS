<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <h1>Cansaço do aluno SPTech</h1>
    <label for="select_transporte">Meio de transporte</label>
    <select name="" id="select_transporte">
        <option value="#" disabled selected>Selecione uma das opções</option>
        <option>Ônibus</option>
        <option>Metrô</option>
        <option>Carro</option>
        <option>Bicicleta</option>
    </select>
    <br>
    <label for="ipt_dist">Distância da faculdade(KM): </label>
    <input type="number" id="ipt_dist">
    <br>
    <button onclick="verificar()">Calcular cansaço</button>
</body>
</html>
<script>
    function verificar() {
        let meio = select_transporte.value;
        let dist = Number(ipt_dist.value)

        if(dist <= 10 && meio == 'Carro' || meio == 'Metrô' || meio == 'Ônibus') {
            alert('Tá tranks...')
        } else if (dist <= 10 && meio !== 'Carro' || meio !== 'Metrô' || meio !== 'Ônibus'){
            alert('É... um pouco cansado...')
        } else if(dist > 10 && meio == 'Carro') {
            alert('É... um pouco cansado')
        } else if( dist > 10 && meio == 'Metrô' || meio == 'Ônibus') {
            alert('Bem cansado...')
        } else if(dist > 10 && meio == 'Bicicleta') {
            alert('Vish... tá só o pó...')
        }

       
    }
</script>
