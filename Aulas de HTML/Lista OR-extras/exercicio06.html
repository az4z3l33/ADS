<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <h1>Cansaço do aluno SPTech</h1>
    <label for="select_transporte">Meio de transporte</label>
    <select name="" id="select_transporte">
        <option value="#" disabled selected>Selecione uma das opções</option>
        <option>Ônibus</option>
        <option>Metrô</option>
        <option>Carro</option>
        <option>Bicicleta</option>
        <option>Uber</option>
    </select>
    <br>
    <button onclick="verificar()">Calcular cansaço</button>
</body>
</html>
<script>
    function verificar() {
        let meio = select_transporte.value;

        if(meio == 'Carro' || meio == 'Uber') {
            alert('Tá tranquilo')
        } else if(meio == 'Metrô' || meio == 'Ônibus') {
            alert('Um pouco cansado')
        } else if(meio == 'Bicicleta') {
            alert('Vish... vive cansado')
        }
    }
</script>
