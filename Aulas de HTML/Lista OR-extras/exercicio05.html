<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 5</title>
</head>
<body>
    <h1>Alerta de desconforto térmico</h1>
    <label for="ipt_temp">Temperatura atual: </label>
    <input type="number" id="ipt_temp">
    <br>
    <button onclick="verificar()">Analisar clima</button>
</body>
</html>
<script>
    function verificar() {
        let temp = Number(ipt_temp.value);

        if(temp < 21 || temp > 24) {
            alert('Alerta de desconforto')
        }

        if(temp < 21) {
            alert('As pessoas vão ter hipotermia')
        } else if(temp > 24) {
            alert('As pessoas vão derreter')
        }
    }
</script>
