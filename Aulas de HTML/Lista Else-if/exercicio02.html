<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>
    <h1>Em qual classe social você se encaixa</h1>
    <label for="ipt_renda">Insira sua renda familiar mensal</label>
    <input type="text" id="ipt_renda" placeholder="ex: 5000">
    <br>
    <button onclick="analisar()">Analisar renda</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let n1 = Number(ipt_renda.value)

        if(n1 <= 250) {
            div_result.innerHTML = `Classe E`
        } else if(n1 <= 900) {
            div_result.innerHTML = `Classe D`
        } else if(n1 <= 2500) {
            div_result.innerHTML = `Classe C`
        } else if(n1 <=9500) {
            div_result.innerHTML = `Classe B`
        } else {
            div_result.innerHTML = `Classe A`
        }

    }
</script>
