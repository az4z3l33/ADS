<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>
<body>
    <h1>Você está no caminho certo?</h1>
    <label for="ipt_meta">Informe sua meta de economia: </label>
    <input type="text" id="ipt_meta">
    <br>
    <label for="ipt_economia">Informe quanto você tem:  </label>
    <input type="text" id="ipt_economia">
    <br>
    <button onclick="analisar()">Analisar economia</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let n1 = Number(ipt_meta.value)
        let n2 = Number(ipt_economia.value)
        let diferenca = n1 - n2
        let ultrapassou = n2 - n1

        if(n2 < n1) {
            div_result.innerHTML = `Força! ainda em busca da meta! Falta R$${diferenca}`
        } else if (n2 == n1) {
            div_result.innerHTML = `Parabéns, meta alcançada!`
        } else {
            div_result.innerHTML = `Meta ultrapassada em R$${ultrapassou}`
        }
    }
</script>
