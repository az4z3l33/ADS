<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <h1>Como o corpo humano percebe temperatura</h1>
    <label for="ipt_temperatura">Insira temperatura: </label>
    <input type="text" id="ipt_temperatura">
    <br>
    <button onclick="analisar()">Analisar</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let n1 = Number(ipt_temperatura.value)

        if(n1 <= 14) {
            div_result.innerHTML = `Congelante`
        } else if(n1 <= 21) {
            div_result.innerHTML = `Com frio`
        } else if(n1 <= 24) {
            div_result.innerHTML = `Confortável`
        } else if(n1 <= 31) {
            div_result.innerHTML = `Com calor`
        } else {
            div_result.innerHTML = `Calor escaldante`
        }
    }
</script>
