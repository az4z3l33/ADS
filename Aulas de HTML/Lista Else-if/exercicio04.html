<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
</head>
<body>
    <h1>Está dentro da faixa saudável? </h1>
    <label for="ipt_peso">Insira o peso de seu filho: </label>
    <input type="text" id="ipt_peso" placeholder="Ex: 15.5">
    <br>
    <button onclick="avaliar()">Avaliar peso</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function avaliar() {
        let n1 = Number(ipt_peso.value)

        if(n1 <=13.5) {
            div_result.innerHTML = `Abaixo do peso`
        } else if(n1 == 18.3) {
            div_result.innerHTML = `Peso perfeito`
        } else if (n1 <= 21.2) {
            div_result.innerHTML = `Peso na média`
        } else {
            div_result.innerHTML = `Acima do peso`
        }
    }
</script>
