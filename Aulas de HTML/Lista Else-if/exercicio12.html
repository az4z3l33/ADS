<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <h1>Divisão por 5</h1>
    <label for="ipt_n1">Informe um número maior que zero: </label>
    <input type="text" id="ipt_n1">
    <br>
    <button onclick="multiplo()">Múltiplo de 5</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function multiplo() {
        let n1 = Number(ipt_n1.value)
        let resto = n1 % 5

        if(resto == 0) {
            div_result.innerHTML=`Perfeito, esse número é múltiplo de cinco`
        } else if(resto == 1) {
            div_result.innerHTML=`Vich, sobrou um`
        } else if(resto == 2) {
            div_result.innerHTML=`Para esse o resto é dois`
        } else if (resto == 3) {
            div_result.innerHTML=`Com mais dois daria certo`
        } else if(resto == 4) {
            div_result.innerHTML=`Só faltou 1 para ser múltiplo de 5`
        }
    }
</script>
