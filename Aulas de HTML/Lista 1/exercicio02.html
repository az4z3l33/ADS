<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
</head>
<body>
<!-- Um campo para inserir o Peso
Um campo para inserir a Altura
Um botão com o texto "Fale comigo"
Ao clicar no botão, uma caixa de alerta deve exibir a mensagem:
"Você pesa X kg e tem Y m de altura"
(onde X e Y são os valores digitados pelo usuário) -->

    <span>Peso: </span>
    <input type="text" placeholder="Digite aqui" id="input_peso">
<br>
    <span>Altura</span>
    <input type="text" placeholder="Digite aqui" id="input_altura">
<br>
    <button onclick="cadastrar()">Cadastrar</button>
</body>
</html>
<script>
    function cadastrar () {
        alert ('Você pesa ' + input_peso.value + 'kg e tem ' + input_altura.value + 'm de altura' )
    }
</script>
