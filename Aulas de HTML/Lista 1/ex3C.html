<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3 Complementar</title>
</head>
<body>
    <span>Temperatura atual: </span>
    <input type="text" id="input_temperatura" placeholder="Ex: 21ºC">
    <br>
    <span>Condição do Tempo: </span>
    <input type="text" id="input_condicao" placeholder="Ex: Nublado, ensolarado">
    <br>
    <button onclick="dica ()">Ver Dica</button>
</body>
</html>
<script>
    function dica() {
        alert ('Está fazendo ' + input_temperatura.value + ' graus e o dia está ' + input_condicao.value)
    }
</script>
