<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Corrida</title>
</head>
<body>
    <label for="ipt_distancia">Insira distância percorrida: </label>
    <input type="number" id="ipt_distancia">
    <br>
    <label for="ipt_velocidade">Insira velocidade média: </label>
    <input type="number" id="ipt_velocidade">
    <br>
    <button onclick="simular()">Simular</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    // item d:
        // 1 passo: calcular quantos litros gastou na corrida
            // regra de 3 com: 10km - 1l
                            // n2 - xL (o que vc quer descobrir)
        // 2 passo: calcular isso em porcentagem
            // regra de 3 com:
                            // 25L (o maximo) - 100%
                            // xL (do item anterior) - porcentagem desejada
                // para colocar na formula, basta multiplicar em cruz e colocar o *formato* que fica, sempre isolando (deixando na esquerda) o que vc quer descobrir ;)
    function simular() {
        let n1 = Number(ipt_distancia.value)
        let n2 = Number(ipt_velocidade.value)
        let tempo = n1 / n2
        let comb = n1 / 10
        let combPorcentagem = comb * 0.25
        let combRestante = 25 - comb
        let comRestantePorcentagem = combRestante * 0.25

        div_result.innerHTML = `Ao percorrer ${n1}km, em velocidade média de ${n2}km/h, a viagem durou ${tempo} horas. Ao todo, foram gastos ${comb} litros de combustível(${combPorcentagem}%). Restam ${combRestante} litros de combustível(${combRestantePorcentagem}%)`
        

    }
</script>
