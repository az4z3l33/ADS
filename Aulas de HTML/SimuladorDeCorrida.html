<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Corrida</title>
</head>
<body>
    <span>Insira distância percorrida: </span>
    <input type="number" id="ipt_distancia">
    <br>
    <span>Insira velocidade média: </span> 
    <input type="number" id="ipt_velocidade">
    <br>
    <button onclick="simulacao()">Simular</button>
    <div id="div_result"></div>
</body>
</html>
<script>

    let combTotal = 25;
    
    function simulacao() {
        let n1 = Number(ipt_distancia.value)
        let n2 = Number(ipt_velocidade.value)
        let tempo = n1 / n2
        let comb = n1 / 10
        let combPorcentagem = (comb * combTotal) / 100
        let combRestante = combTotal - comb
        let comRestantePorcentagem = (combRestante * combTotal) / 100
        let mensagem;

        mensagem = `Ao percorrer ${n1}km, em velocidade média de ${n2}km/h, a viagem durou ${tempo} horas. Ao todo, foram gastos ${comb} litros de combustível(${combPorcentagem}%). Restam ${combRestante} litros de combustível(${combRestantePorcentagem}%)`
        div_result.innerHTML = mensagem

    }
</script>
