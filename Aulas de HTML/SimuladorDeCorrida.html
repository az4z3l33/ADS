<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Corrida</title>
</head>
<body>
    <span>Insira distância percorrida: </span>
    <input type="text" id="ipt_distancia">
    <br>
    <span>Insira velocidade média: </span> 
    <input type="text" id="ipt_velocidade">
    <br>
    <button onclick="simulacao()">Simular</button>
    <div id="div_result"></div>
</body>
</html>
<script>   
    function simulacao() {
        let n1 = Number(ipt_distancia.value)
        let n2 = Number(ipt_velocidade.value)
        let combTotal = 25
        let tempo = n1 / n2
        let comb = n1 / 10
        let combPorcentagem = (comb * 100) / combTotal
        let combRestante = combTotal -= comb
        let combRestantePorcentagem = (combRestante * 100) / combTotal

        

        if(combRestantePorcentagem >= 30) {
            div_result.innerHTML += `Ao percorrer ${n1}km, em velocidade média de ${n2}km/h, a viagem durou ${tempo} horas. Ao todo, foram gastos ${comb} litros de combustível(${combPorcentagem}%). Restam ${combRestante} litros de combustível(${combRestantePorcentagem}%) <br> <b>Continue á rodar!</b>`
        } else {
            div_result.innerHTML += `Ao percorrer ${n1}km, em velocidade média de ${n2}km/h, a viagem durou ${tempo} horas. Ao todo, foram gastos ${comb} litros de combustível(${combPorcentagem}%). Restam ${combRestante} litros de combustível(${combRestantePorcentagem}%) <br> <b>É melhor parar para abastecer!</b>`
        }

    }
</script>
