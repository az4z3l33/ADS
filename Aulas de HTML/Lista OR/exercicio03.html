<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>
    <label for="ipt_ind">Renda individual: </label>
    <input type="number" id="ipt_ind">
    <br>
    <label for="ipt_fam">Renda familiar: </label>
    <input type="number" id="ipt_fam">
    <br>
    <button onclick="verificar()">Terei o beneficio</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let ind = Number(ipt_ind.value)
        let fam = Number(ipt_fam.value)

        if(ind <= 2000 || fam <= 3000) {
            div_result.innerHTML=`Você terá direito ao auxílio`
        } else {
            div_result.innerHTML=`Sem direito ao auxílio`
        }
    }
</script>
