<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>
    <h1>Mentes Brilhantes</h1>
    <label for="ipt_enem">Sua nota do ENEM: </label>
    <input type="number" id="ipt_enem">
    <br>
    <label for="ipt_vest">Sua nota no vestibular interno: </label>
    <input type="number" id="ipt_vest">
    <br>
    <button onclick="verificar()">Avaliação</button>
</body>
</html>
<script>
    function verificar() {
        let n1 = Number(ipt_enem.value)
        let n2 = Number(ipt_vest.value)

        if(n1 >= 800 || n2 >= 700) {
            alert('Parabéns! Aprovado')
        } else {
            alert('Tente semestre que vem!')
        }
    }
</script>
