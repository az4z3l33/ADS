<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <label for="ipt_fruta">Fruta: </label>
    <input type="text" id="ipt_fruta">
    <button onclick="verificar()">Vai comer?</button>
</body>
</html>
<script>
    function verificar() {
        let fruta = ipt_fruta.value

        if( fruta == 'Uva' || fruta == 'Abacaxi') {
            alert('Sim, vai comer ' + fruta)
        } else {
            alert('A fruta ' + fruta + ' ela não come')
        }
    }
</script>
