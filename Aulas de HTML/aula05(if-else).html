<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5</title>
</head>
<body>
    <span>Insira sua idade: </span>
    <input type="number" id="input_idade">
    <br>
    <button onclick="exibir()">Exibir</button>
</body>
</html>
<script>
    function exibir() {
        let idade = Number(input_idade.value)

        if(idade >= 16) {
            alert ('Pode votar')
        } else { alert('Não pode votar')}
    }
</script>
