<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <h1>Desempenho escolar</h1>
    <label for="ipt_nota">Nota: </label>
    <input type="number" id="ipt_nota" placeholder="Insira sua Nota">
    <br>
    <label for="ipt_freq">Frequência: </label>
    <input type="number" id="ipt_freq" placeholder="Insira sua frequência nas aulas">
    <br>
    <button onclick="analisar()">Analisar aluno</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let nota = Number(ipt_nota.value);
        let freq = Number(ipt_freq.value);

        if(nota < 0 || nota > 10){
            alert('Onde já se viu nota menor que 0 ou maior que 10?!')
            div_result.innerHTML=``
        }else if(freq < 0 || freq > 100) {
            alert('Onde já se viu frequência menor que 0 ou maior que 100?!')
            div_result.innerHTML=``
        }else if(nota >= 0 && nota < 6) {
            div_result.innerHTML=`Aluno ficou abaixo da média`
        }else if(nota >= 6 && nota <= 8) {
            div_result.innerHTML=`Aluno ficou na média`
        }else if(nota > 8 && nota <=10) {
            div_result.innerHTML=`Aluno acima da média`
        }
         
        if(freq >= 75) {
            div_result.innerHTML+=`<br>Aluno aprovado por frequência`
        } else if(freq < 75) {
            div_result.innerHTML+=`<br>Aluno reprovado por frequência`
        }
    }
</script>
