<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <h1>Dê sua nota!</h1>
    <label for="ipt_nota">Nota do atendimento: </label>
    <input type="text" id="ipt_nota">
    <br>
    <button onclick="avaliar()">Avaliar atendimento</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function avaliar() {
        let nota = Number(ipt_nota.value)

        if(nota >= 0 && nota < 5) {
            div_result.innerHTML=`Não aprovado`
        }else if(nota == 5 || nota == 6){
            div_result.innerHTML=`Neutro`
        }else if(nota > 6 && nota <= 10){
            div_result.innerHTML=`Aprovado`
        }else if(nota < 0 || nota > 10){
            div_result.innerHTML=`Notá inválida`
        }
    }
</script>
