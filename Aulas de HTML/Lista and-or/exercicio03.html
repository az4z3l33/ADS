<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <h1>Bilhete Único</h1>
    <label for="slc_tipo">Tipo de Passageiro</label>
    <select name="" id="slc_tipo">
        <option value="#" selected disabled>Selecione uma opção</option>
        <option>Comum</option>
        <option>Estudante</option>
        <option value="Idoso">Idoso/PNE</option>
    </select>
    <br>
    <label for="slc_passagen">Tipo de passagem</label>
    <select id="slc_passagem">
        <option value="#" selected disabled>Selecione um tipo de passagem</option>
        <option value="4.40">Passagem única</option>
        <option value="5.90">Passagem integração</option>
    </select>
    <br>
        <button onclick="simular()">Simular preço</button>
        <div id="div_result"></div>

</body>
</html>
<script>
    function simular() {
        let passagem = Number(slc_passagem.value)
        let tipo = slc_tipo.value
        let descEstudante = passagem - (passagem / 2)

        if(tipo == 'Comum' && (passagem == 4.40 || passagem == 5.90)){
            div_result.innerHTML=`Valor da passagem escolhida R$${passagem}`
        } else if(tipo == 'Estudante' && (passagem == 4.40 || passagem == 5.90)){
            div_result.innerHTML=`Valor da passagem R$${descEstudante}<br>
            Desconto de estudante aplicado`
        } else if(tipo == 'Idoso'){
            div_result.innerHTML=`Gratuidade aplicada!`
        }
    }
</script>
