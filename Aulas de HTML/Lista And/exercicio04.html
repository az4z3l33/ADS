<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <label for="ipt_hora">Hora que costuma assistir: </label>
    <input type="number" id="ipt_hora">
    <br>
    <button onclick="verificar()">Ver recomendação</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let horas = Number(ipt_hora.value);

        if(horas >= 19 && horas <= 21) {
            div_result.innerHTML=`Não é recomendável que você assista sua série favorita no horario ${horas + ':00'}`
        } else {
            div_result.innerHTML=`O horário ${horas + ':00'} é adequado para assistir sua série favorita!`
        }
    }
</script>
