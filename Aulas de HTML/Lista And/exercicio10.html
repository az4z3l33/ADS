<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    <label for="ipt_pass">Quantidade de passagens: </label>
    <input type="number" id="ipt_pass">
    <br>
    <button onclick="comprar()">Comprar</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function comprar() {
        let pass = Number(ipt_pass.value)
        let valor = pass * 4.40
        let desconto3 = valor - (valor * 0.03)
        let desconto5 = valor - (valor * 0.05)
        let desconto7 = valor - (valor * 0.07)

        if(pass >= 8 && pass <= 50){
            if(pass >=8 && pass <= 19) {
                div_result.innerHTML=`Total a pagar: R$${desconto3.toFixed(2)}`
            } else if(pass >= 20 && pass <= 49) {
                div_result.innerHTML=`Total a pagar: RR${desconto5.toFixed(2)}`
            } else if(pass == 50) {
                div_result.innerHTML=`Total a pagar: R$${desconto7.toFixed(2)}`
            }
        } else {
            alert('Quantidade inválida para o Fidelidade!')
        }
    }
</script>
