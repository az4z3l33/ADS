<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <Label for="ipt_temp">Temperatura atual: </Label>
    <input type="number" id="ipt_temp">
    <br>
    <button onclick="verificar()">Ver situação</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let temp = Number(ipt_temp.value)

        if (temp >= 21 && temp <= 24) {
            div_result.innerHTML = `Temperatura confortável :D`
        } else {
            alert('Temperatura DESCONFORTÁVEL :C')
        }
    }
</script>
