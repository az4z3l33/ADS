<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>
    <label for="ipt_renda">Sua renda: </label>
    <input type="number" id="ipt_renda">
    <br>
    <label for="ipt_fam">Renda familiar: </label>
    <input type="number" id="ipt_fam">
    <br>
    <button onclick="verificar()">Verificar situação</button>
</body>
</html>
<script>
    function verificar() {
        let renda = Number(ipt_renda.value)
        let fam = Number(ipt_fam.value)

        if(renda <= 1050 && fam <= 2100) {
            alert('Você terá direito!')
        } else {
            alert('Você NÃO terá direito')
        }
    }
</script>
