<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>

    <h1>Seu resultado é aceitável?</h1>
    <label for="ipt_nota">Sua nota</label>
    <input type="number" id="ipt_nota">
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
</html>
<script>
    function avaliar() {
        let n1 = Number(ipt_nota.value)

        if(n1 >= 0 && n1 <= 10) {
            alert('Nota válida')
        } else {
            alert('Onde já se viu nota menor que 0 e maior que 10?!')
        }
    }
</script>
