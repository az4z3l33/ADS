<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<body>
     <label for="ipt_login">Login: </label>
    <input type="text" id="ipt_login">
    <br>
    <label for="ipt_senha">Senha: </label>
    <input type="password" id="ipt_senha">
    <br>
    <label for="ipt_code">Código de segurança: </label>
    <input type="password" id="ipt_code">
    <br>
    <button onclick="verificar()">Entrar</button>
</body>
</html>
<script>
    function verificar() {
        let login = ipt_login.value;
        let senha = ipt_senha.value;
        let code = ipt_code.value

        if(login == 'SPTech' && senha == 'digital' && code == 123) {
            alert('Usuário autenticado com sucesso')
        } else {
            alert('Falha na autenticação')
        }
    }
</script>
