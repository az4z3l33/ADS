<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9</title>
</head>
<body>
    <label for="ipt_inicial">Altura inicial: </label>
    <input type="number" id="ipt_inicial">
    <br>
    <label for="ipt_final">Altura final: </label>
    <input type="number" id="ipt_final">
    <br>
    <label for="ipt_nome">Nome: </label>
    <input type="text" id="ipt_nome">
    <br>
    <label for="ipt_altura">Altura: </label>
    <input type="number" id="ipt_altura">
    <br>
    <button onclick="verificar()">Verificar candidato</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let inicial = Number(ipt_inicial.value)
        let final = Number(ipt_final.value)
        let nome = ipt_nome.value
        let altura = Number(ipt_altura.value)

        if( inicial > 1 && final > inicial) {
            if(altura >= inicial && altura <= final ) {
                div_result.innerHTML += `O candidato ${nome}, com altura de ${altura} metros, participará do processo de seleção de piloto <br>`
            } else {
                div_result.innerHTML += `O candidato ${nome}, com altura de ${altura} metros, não atende os requisitos da seleção<br>`
            }
        } else {
            div_result.innerHTML=`Intervalo da altura de seleção é inválida! A altura inicial deve ser maior que 1 e altura final deve ser maior que a altura inicial`
        }
    }
</script>
