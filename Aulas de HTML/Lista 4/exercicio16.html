<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 16</title>
</head>
<body>
    <h1>Par ou impar</h1>
    <span>Insira um número: </span>
    <input type="Number" id="ipt_n1">
    <br>
    <button onclick="verificar()">Analisar</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
    let n1 = Number(ipt_n1.value)
    let resto = n1 % 2

        if(resto == 0) {
            div_result.innerHTML = `<span style="color: red; background-color: yellow;">Esse número é PAR</span>`
        } else {
            div_result.innerHTML = `<b style="color: blue;">Esse número é impar</b>`
        }


    }
</script>
