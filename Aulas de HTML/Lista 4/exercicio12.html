<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <h1>Finanças!</h1>
    <span>Informe o valor do saldo da sua conta: </span>
    <input type="number" id="ipt_saldo">
    <br>
    <button onclick="verificar()">Verificar finanças</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let n1 = Number(ipt_saldo.value)

        if(n1 == 0 ) {
            div_result.innerHTML = `<span style="color: black;">Conta zerada</span>`
        }

        if(n1 < 0 ) {
            div_result.innerHTML = `<span style="color: red;">Está devendo!</span>`
        }

        if(n1 > 0) {
            div_result.innerHTML = `<span style="color: blue;">Saldo positivo! sorriso</span>`
        }
    }
</script>
