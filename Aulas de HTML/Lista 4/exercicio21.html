<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 21</title>
</head>
<body>
    <h1>Análise de temperatura</h1>
    <label for="ipt_temp">Insira a temperatura atual: </label>
    <input type="number" id="ipt_temp">
    <br>
    <button onclick="verificar()">Verificar clima</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let n1 = Number(ipt_temp.value)

        if(n1 >= 10){
            div_result.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-j-GywATx4qqFm1UrYHUFnMm8FOByDPE7xZyVMmW2fA&s=10" alt="">`
        } else {
            div_result.innerHTML = `<img src="https://amopaocaseiro.com.br/wp-content/uploads/2019/12/pao-de-forma-caseiro_02-840x560.jpg" alt="">`
        }
    }
</script>
