<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 18</title>
</head>
<body>
    <h1>Mercado BOM DOCE</h1>
    <label for="ipt_choco">Quantidade de chocolates comprados: </label>
    <input type="number" id="ipt_choco">
    <br>
    <button onclick="compra()">Compra</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function compra() {
        let n1 = Number(ipt_choco.value)
        let choco = n1 * 3
        let desconto = n1 * 2.5

        if(n1 > 6) {
            div_result.innerHTML = `O valor da sua compra foi de R$${desconto}`
        } else {
            div_result.innerHTML = `O valor da sua compra foi de R$${choco}`
        }

    }
</script>
