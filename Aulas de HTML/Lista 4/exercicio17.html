<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 17</title>
</head>
<body>
    <h1>Teste de divisibilidade</h1>
    <span>Insira primeiro número: </span>
    <input type="number" id="ipt_n1">
    <br>
    <span>Insira segundo número: </span>
    <input type="number" id="ipt_n2">
    <br>
    <button onclick="teste()">Testar</button>
    <div id="div_result"></div>

</body>
</html>
<script>
    function teste() {
        let n1 = Number(ipt_n1.value)
        let n2 = Number(ipt_n2.value)
        let resto = n1 % n2

        if(resto == 0) {
            div_result.innerHTML = `<img src="https://conjur.com.br/wp-content/uploads/2023/07/emoji-joinha.jpeg" alt="">`
        } else {
            div_result.innerHTML = `<img src="https://st2.depositphotos.com/1001911/10086/v/950/depositphotos_100869342-stock-illustration-vector-deny-emoticon.jpg" alt="">`
        }

    }
</script>
