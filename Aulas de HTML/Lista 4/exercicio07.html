<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 7</title>
</head>
<body>
    <h1>Financiando sua casa</h1>
    <span>Valor da sua renda familiar: </span>
    <input type="number" id="input_renda">
    <br>
    <span>Valor da prestação: </span>
    <input type="number" id="input_prestacao">
    <br>
    <button onclick="verificar()">Verificar financiamento</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let n1 = Number(input_renda.value)
        let n2 = Number(input_prestacao.value)
        let total = (n2 / n1) * 100

        div_result.innerHTML = `A prestação corresponde a ${total}% da renda familiar`

        if(total >= 30) {
            div_result.innerHTML += `<br>Será necessário complementar a sua renda familiar`
        }

    }
</script>
