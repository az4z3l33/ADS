<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 15</title>
</head>
<body>
    <h1>Elevador!</h1>
    <span>Quantos homens estão no elevador?: </span>
    <input type="number" id="input_homens">
    <br>
    <span>Quantas mulheres estão no elevador?: </span>
    <input type="number" id="input_mulheres">
    <br>
    <button onclick="ligar()">Ligar elevador</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function ligar() {
        let n1 = Number(input_homens.value)
        let n2 = Number(input_mulheres.value)
        let h = n1 * 90
        let m = n2 * 70
        let total = h + m
        let resto = total - 500

        if(total > 500) {
            div_result.innerHTML = `<span style="color: red">Precisa perder ${resto}kg para mover o elevador</span>`
        } else {
            div_result.innerHTML = `<span style="color: green">Elevador vai se mover, pois está com ${total}kg</span>`
        }

    }
</script>
