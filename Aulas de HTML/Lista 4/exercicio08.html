<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>
<body>
    <h1>Cheque!</h1>
    <span>Saldo da sua conta: </span>
    <input type="number" id="input_saldo">
    <br>
    <span>Valor do débito: </span>
    <input type="number" id="input_debito">
    <br>
    <button onclick="analisar()">Analisar conta</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let n1 = Number(input_saldo.value)
        let n2 = Number(input_debito.value)
        let atual = n1 - n2

        div_result.innerHTML = `O saldo atual da sua conta corrente é R$${atual.toFixed(2)}`

        if(atual < 0) {
            div_result.innerHTML = `<b style="color: red">O saldo atual da sua conta corrente é R$${atual.toFixed(2)}</b>`
        }
    }
</script>
