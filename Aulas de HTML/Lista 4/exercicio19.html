<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exericio 19</title>
</head>
<body>
    <h1>Economia</h1>
    <label for="ipt_meta">Qual sua meta de economia?: </label>
    <input type="number" id="ipt_meta">
    <br>
    <label for="ipt_guardado">Quando você tem guardado?: </label>
    <input type="number" id="ipt_guardado">
    <br>
    <button onclick="analise()">Analisar economia</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analise() {
        let n1 = Number(ipt_meta.value)
        let n2 = Number(ipt_guardado.value)
        let meta = n2 - n1
        let falta = n1 - n2

        if(n2 == n1) {
            div_result.innerHTML = `Parabéns, meta alcançada!`
        }

        if(n2 > n1) {
            div_result.innerHTML = `Parabéns, meta alcançada! <br>Meta ultrapassada em R$${meta}`
        }

        if(n2 < n1) {
            div_result.innerHTML = `Força! Ainda em busca da meta! Falta R$${falta}`
        }
    }
</script>
